<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#1553b0}canvas{image-rendering:pixelated}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { renderFish, SPECIES } from '../js/art/fish.js';
const S = 4;
const c = document.getElementById('c');
const W = 460, H = 330;
c.width = W; c.height = H; c.style.width = W*S+'px'; c.style.height = H*S+'px';
const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2f8ef0'); g.addColorStop(1,'#0f3f98');
ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
const rows = [
  ['trevally', [34, 26, 18]], ['giant', [48]], ['shark', [130]], ['reefshark', [100]], ['grouper', [70]],
  ['bait', [12, 9]], ['butterfly', [20]], ['tang', [22]], ['snapper', [28]], ['batfish', [26]],
];
let x = 4, y = 4, rowH = 0;
const t0 = performance.now();
for (const [id, lens] of rows) {
  for (const L of lens) {
    for (let f = 0; f < Math.min(4, SPECIES[id].frames); f += 1) {
      const s = renderFish(id, L, f * Math.floor(SPECIES[id].frames/4), 0);
      if (x + s.width > W) { x = 4; y += rowH + 4; rowH = 0; }
      ctx.drawImage(s, x, y); x += s.width + 3; rowH = Math.max(rowH, s.height);
    }
  }
  x += 6;
}
// pitch test
y += rowH + 6; x = 4;
for (let a = -0.5; a <= 0.5; a += 0.25) { const s = renderFish('trevally', 34, 0, a); ctx.drawImage(s, x, y); x += s.width + 4; }
for (let a = -0.5; a <= 0.5; a += 0.25) { const s = renderFish('trevally', 34, 0, a, 1); ctx.drawImage(s, x, y); x += s.width + 4; }
document.title = 'done ' + (performance.now()-t0).toFixed(0);
</script></body></html>
