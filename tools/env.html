<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#1553b0}canvas{image-rendering:pixelated}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { genFormation, genStatue, genSand, genKelp, genPillar, genCaustics } from '../js/art/env.js';
const S = 3, W = 620, H = 400;
const c = document.getElementById('c');
c.width = W; c.height = H; c.style.width = W*S+'px'; c.style.height = H*S+'px';
const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2f8ef0'); g.addColorStop(1,'#0f3f98');
ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
const t0 = performance.now();
const f = genFormation({ w: 380, h: 250, seed: 7, profile: x => 0.98 - 0.75 * Math.pow(x, 1.4) });
ctx.drawImage(f, 0, 20);
const st = genStatue();
ctx.drawImage(st, 400, 10);
const p = genPillar(3, 150); ctx.drawImage(p, 540, 60);
const sand = genSand(620, 48); ctx.drawImage(sand, 0, 330);
const k = genKelp(90, 5); ctx.drawImage(k[0], 360, 180); ctx.drawImage(k[8], 380, 180);
const ca = genCaustics(); ctx.drawImage(ca[0], 520, 230);
document.title = 'ms ' + (performance.now()-t0).toFixed(0);
</script></body></html>
